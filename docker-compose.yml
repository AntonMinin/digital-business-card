services:
  db:
    image: cockroachdb/cockroach:latest-v25.2
    command: start-single-node --insecure
    ports:
      - "26257:26257"
      - "8080:8080"
    volumes:
      - db-data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health?ready=1"]
      interval: 5s
      retries: 20

  db-init:
    image: cockroachdb/cockroach:latest-v25.2
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ./cockroach sql --insecure --host=db -e "CREATE DATABASE IF NOT EXISTS card"

  app:
    build: .
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://root@db:26257/card?sslmode=disable
      PORT: 3000
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    ports:
      - "3000:3000"

volumes:
  db-data:
