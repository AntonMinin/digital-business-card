<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital Business Card</title>
  <style>
    :root {
      --bg: #f4f4f1;
      --card: #ffffff;
      --text: #1c1c1a;
      --muted: #6b6b66;
      --accent: #2f5d50;
      --chip: #eaf0ed;
      --border: #e2e2dc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141413;
        --card: #1e1e1c;
        --text: #ecece8;
        --muted: #9a9a93;
        --accent: #7fc4ad;
        --chip: #26302c;
        --border: #2e2e2b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
    }
    h1 { margin: 0; font-size: 28px; line-height: 1.2; }
    .title { margin: 4px 0 0; color: var(--accent); font-weight: 600; }
    .meta { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    .meta a { color: inherit; }
    .about { margin: 24px 0; }
    h2 { margin: 24px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
    .skills li { background: var(--chip); border-radius: 999px; padding: 4px 12px; font-size: 14px; }
    .skills li span { color: var(--muted); font-size: 12px; margin-left: 6px; }
    .links a { color: var(--accent); font-weight: 600; }
    footer { margin-top: 32px; font-size: 12px; color: var(--muted); }
    @media (max-width: 480px) { main { padding: 24px 20px; } }
  </style>
</head>
<body>
  <main id="card" aria-live="polite">Загрузка…</main>
  <script>
    const query = `{
      profile {
        fullName title location email about updatedAt
        skills { name category }
        links { label url }
      }
    }`;

    const el = (tag, props = {}, ...children) => {
      const node = Object.assign(document.createElement(tag), props);
      node.append(...children);
      return node;
    };

    async function render() {
      const card = document.getElementById('card');
      try {
        const res = await fetch('/graphql', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query }),
        });
        const { data, errors } = await res.json();
        if (errors) throw new Error(errors[0].message);
        const p = data.profile;
        card.replaceChildren(
          el('h1', { textContent: p.fullName }),
          el('p', { className: 'title', textContent: p.title }),
          el('p', { className: 'meta' }, `${p.location} · `, el('a', { href: `mailto:${p.email}`, textContent: p.email })),
          el('p', { className: 'about', textContent: p.about }),
          el('h2', { textContent: 'Навыки' }),
          el('ul', { className: 'skills' }, ...p.skills.map(s => el('li', {}, s.name, el('span', { textContent: s.category })))),
          el('h2', { textContent: 'Ссылки' }),
          el('ul', { className: 'links' }, ...p.links.map(l => el('li', {}, el('a', { href: l.url, textContent: l.label })))),
          el('footer', { textContent: `Обновлено ${new Date(p.updatedAt).toLocaleDateString('ru-RU')} · NestJS · GraphQL · Prisma · CockroachDB` }),
        );
      } catch (e) {
        card.textContent = `Не удалось загрузить визитку: ${e.message}`;
      }
    }

    render();
  </script>
</body>
</html>
